<!-- progress.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress - Self-Control Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Your Progress</h1>
            <p>Track your personal progress over time!</p>
        </header>

        <section class="progress-section">
            <h2>Progress Overview</h2>
            <p>Success Count: <span id="progress-success">0</span></p>
            <p>Failure Count: <span id="progress-failure">0</span></p>
            <p>Progress Percentage: <span id="progress-percent">0%</span></p>
        </section>

        <a href="index.html">Back to Tracker</a>
    </div>

    <script src="progress.js"></script>
</body>
</html>
