<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Success - Tracker</title>
</head>
<body>
    <div id="app">
        <header>
            <h1>Total Successes</h1>
        </header>

        <div id="content">
            <p><strong>Total Successes: </strong><span id="total-success-count">0</span></p>
        </div>

        <button id="back-button">Back to Home</button>
    </div>

    <script>
        // Retrieve and display total success count
        document.addEventListener('DOMContentLoaded', function() {
            const successCount = localStorage.getItem("successCount") || 0;
            document.getElementById("total-success-count").textContent = successCount;
        });

        // Back button functionality
        document.getElementById("back-button").addEventListener("click", function() {
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
