<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Urge</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .form-container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: space-between;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .success-btn {
      background-color: #00e676;
      color: #000;
    }

    .failure-btn {
      background-color: #ff1744;
      color: #fff;
    }

    button:hover {
      transform: scale(1.05);
    }

    .back-btn {
      margin-top: 30px;
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #000;
    }

    .msg {
      margin-top: 20px;
      font-size: 1rem;
      color: #90ee90;
    }
  </style>
</head>
<body>
  <h1>Log Urge</h1>
  <div class="form-container">
    <textarea id="reason" placeholder="Write reason for success or failure..." rows="4"></textarea>
    <div class="btn-group">
      <button class="success-btn" onclick="logUrge('Success')">✔ Urge Success</button>
      <button class="failure-btn" onclick="logUrge('Failure')">✘ Urge Failure</button>
    </div>
    <p class="msg" id="message"></p>
  </div>
  <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

  <script>
    function logUrge(type) {
      const reason = document.getElementById('reason').value.trim();
      const msg = document.getElementById('message');

      if (!reason) {
        msg.style.color = "#ffcccb";
        msg.innerText = "Please enter a reason!";
        return;
      }

      const urges = JSON.parse(localStorage.getItem('urges')) || [];
      const time = new Date().toLocaleString();

      urges.push({ type, reason, time });
      localStorage.setItem('urges', JSON.stringify(urges));

      msg.style.color = "#90ee90";
      msg.innerText = `Urge ${type.toLowerCase()} saved successfully!`;

      document.getElementById('reason').value = '';
    }
  </script>
</body>
</html>
