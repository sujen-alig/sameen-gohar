<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    /* Same styles as before */
    /* Add your CSS styles here */
  </style>
</head>
<body>

  <div class="container">
    <h1>Admin Dashboard</h1>
    <h2>Registered Users</h2>
    <div id="appraisalList"></div>
  </div>

  <script>
    // Retrieve users data from localStorage
    window.onload = function() {
      const users = JSON.parse(localStorage.getItem('users')) || [];

      const listContainer = document.getElementById('appraisalList');

      if (users.length === 0) {
        listContainer.innerHTML = '<p>No users registered.</p>';
        return;
      }

      users.forEach((user, index) => {
        const listItem = document.createElement('div');
        listItem.classList.add('appraisal-item');

        listItem.innerHTML = `
          <h3>Username: ${user.username}</h3>
          <p>Email: ${user.email}</p>
          <p>Status: <strong>${user.status}</strong></p>
          <p>Submitted at: ${new Date(user.timestamp).toLocaleString()}</p>
          <div class="actions">
            <button class="btn btn-approve" onclick="approveUser(${index})">Approve</button>
            <button class="btn btn-remove" onclick="removeUser(${index})">Remove</button>
          </div>
        `;

        listContainer.appendChild(listItem);
      });
    };

    function approveUser(index) {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      users[index].status = 'Approved';
      localStorage.setItem('users', JSON.stringify(users));
      window.location.reload();  // Refresh the page to show updated status
    }

    function removeUser(index) {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      users.splice(index, 1);  // Remove user from the array
      localStorage.setItem('users', JSON.stringify(users));
      window.location.reload();  // Refresh the page to show updated list
    }
  </script>

</body>
</html>
