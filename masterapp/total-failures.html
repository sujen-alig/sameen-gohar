<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Failures - Tracker</title>
</head>
<body>
    <div id="app">
        <header>
            <h1>Total Failures</h1>
        </header>

        <div id="content">
            <p><strong>Total Failures: </strong><span id="total-failure-count">0</span></p>
        </div>

        <button id="back-button">Back to Home</button>
    </div>

    <script>
        // Retrieve and display total failure count
        document.addEventListener('DOMContentLoaded', function() {
            const failureCount = localStorage.getItem("failureCount") || 0;
            document.getElementById("total-failure-count").textContent = failureCount;
        });

        // Back button functionality
        document.getElementById("back-button").addEventListener("click", function() {
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
