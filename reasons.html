<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasons Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }

    h1 {
      color: #00e676;
      text-align: center;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 40px;
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .section h2 {
      color: #60a5fa;
      margin-bottom: 10px;
    }

    .log {
      background: #374151;
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 10px;
    }

    .buttons {
      margin-bottom: 15px;
    }

    .buttons button {
      margin-right: 10px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons button:hover {
      background: #1e40af;
    }

    .export-btn {
      background-color: #10b981;
    }

    .export-btn:hover {
      background-color: #059669;
    }

    .back-btn {
      background: crimson;
      float: right;
    }

    .back-btn:hover {
      background: darkred;
    }
  </style>
</head>
<body>

  <h1>📋 Reasons Dashboard</h1>

  <div class="section">
    <h2>🧠 Success / Failure</h2>
    <div class="buttons">
      <button onclick="filterLogs('sf', 'All')">All</button>
      <button onclick="filterLogs('sf', 'Success')">Success</button>
      <button onclick="filterLogs('sf', 'Failure')">Failure</button>
      <button class="export-btn" onclick="exportLogs('sf')">Export</button>
    </div>
    <div id="sf-logs"></div>
  </div>

  <div class="section">
    <h2>🧭 Right / Wrong</h2>
    <div class="buttons">
      <button onclick="filterLogs('rw', 'All')">All</button>
      <button onclick="filterLogs('rw', 'Right')">Right</button>
      <button onclick="filterLogs('rw', 'Wrong')">Wrong</button>
      <button class="export-btn" onclick="exportLogs('rw')">Export</button>
    </div>
    <div id="rw-logs"></div>
  </div>

  <button class="back-btn" onclick="window.location.href='index.html'">⬅ Back</button>

  <script>
    let sfData = JSON.parse(localStorage.getItem('urges')) || [];
    let rwData = JSON.parse(localStorage.getItem('rwData')) || [];

    function displayLogs(data, containerId, type = 'All') {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      data.forEach(entry => {
        if (type === 'All' || entry.type === type) {
          const div = document.createElement('div');
          div.className = 'log';
          div.innerHTML = `
            <strong>${entry.type}</strong> — ${entry.reason || 'No reason'}<br>
            <small>${new Date(entry.time).toLocaleString()}</small>
          `;
          container.appendChild(div);
        }
      });
    }

    function filterLogs(category, type) {
      if (category === 'sf') {
        displayLogs(sfData, 'sf-logs', type);
      } else {
        displayLogs(rwData, 'rw-logs', type);
      }
    }

    function exportLogs(category) {
      let data = category === 'sf' ? sfData : rwData;
      let text = data.map(e => `${e.type} - ${e.reason || 'No reason'} - ${new Date(e.time).toLocaleString()}`).join('\n');
      let blob = new Blob([text], { type: 'text/plain' });
      let link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${category === 'sf' ? 'Success-Failure' : 'Right-Wrong'}-reasons.txt`;
      link.click();
    }

    // Initialize both
    displayLogs(sfData, 'sf-logs');
    displayLogs(rwData, 'rw-logs');
  </script>
</body>
</html>
