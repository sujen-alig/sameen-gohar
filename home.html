<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Home</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .home-container {
      background: #2d3436;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    .home-container h1 {
      color: #00b894;
    }

    button {
      background-color: #00b894;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #019875;
    }

    .logout {
      background-color: crimson;
      padding: 12px 24px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 20px;
    }

    .logout:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <h1>Welcome to Your Dashboard</h1>
    <p>Manage your urges, track progress, and view analytics!</p>

    <button onclick="goTo('add-urge.html')">➕ Add Urge</button>
    <button onclick="goTo('urges.html')">📘 View Urges</button>
    <button onclick="goTo('analytics.html')">📊 View Analytics</button>
    <button onclick="goTo('summary.html')">🧠 Summary</button>
    <button onclick="goTo('rw-analytics.html')">📈 Right & Wrong Analytics</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyClczr-VHpPkFgrPfOQJI5aL6-zL0lWOv8",
      authDomain: "sujen-2130a.firebaseapp.com",
      databaseURL: "",
      projectId: "sujen-2130a",
      storageBucket: "sujen-2130a.firebasestorage.app",
      messagingSenderId: "818571217823",
      appId: "1:818571217823:web:1231f1cfb38810c7d1cbaa"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Logout function
    function logout() {
      auth.signOut().then(() => {
        window.location.href = "login.html"; // Redirect to login page
      });
    }

    // Go to a different page
    function goTo(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
