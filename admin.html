<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding: 20px;
    }

    .panel {
      background: #2d3436;
      width: 100%;
      max-width: 900px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .panel h2 {
      color: #00b894;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      padding: 12px;
      text-align: center;
      border: 1px solid #fff;
    }

    .approve-btn, .reject-btn {
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .approve-btn {
      background-color: #00b894;
    }

    .approve-btn:hover {
      background-color: #019875;
    }

    .reject-btn {
      background-color: #e74c3c;
    }

    .reject-btn:hover {
      background-color: #c0392b;
    }

    .logout {
      background-color: crimson;
      padding: 12px 20px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 20px;
    }

    .logout:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Admin Panel - User Approvals</h2>

    <table id="userTable">
      <thead>
        <tr>
          <th>Email</th>
          <th>Password</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Users will be populated here -->
      </tbody>
    </table>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
    const firebaseConfig = {
  apiKey: "AIzaSyClczr-VHpPkFgrPfOQJI5aL6-zL0lWOv8",
  authDomain: "sujen-2130a.firebaseapp.com",
  projectId: "sujen-2130a",
  storageBucket: "sujen-2130a.appspot.com",
  messagingSenderId: "818571217823",
  appId: "1:818571217823:web:1231f1cfb38810c7d1cbaa",
  databaseURL: "https://sujen-2130a-default-rtdb.firebaseio.com"
};
,
     
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load the users from Firebase and display them in the table
    function loadUsers() {
      const tableBody = document.getElementById('userTable').getElementsByTagName('tbody')[0];

      db.ref("approvals").once("value", (snapshot) => {
        snapshot.forEach((childSnapshot) => {
          const data = childSnapshot.val();
          const row = tableBody.insertRow();

          row.insertCell(0).textContent = data.email;
          row.insertCell(1).textContent = data.password;
          row.insertCell(2).textContent = data.approved ? "Approved" : "Pending";

          const actionCell = row.insertCell(3);
          if (!data.approved) {
            const approveButton = document.createElement('button');
            approveButton.textContent = "Approve";
            approveButton.classList.add('approve-btn');
            approveButton.onclick = () => approveUser(childSnapshot.key, data);

            const rejectButton = document.createElement('button');
            rejectButton.textContent = "Reject";
            rejectButton.classList.add('reject-btn');
            rejectButton.onclick = () => rejectUser(childSnapshot.key);

            actionCell.appendChild(approveButton);
            actionCell.appendChild(rejectButton);
          } else {
            actionCell.textContent = "Already Approved";
          }
        });
      });
    }

    // Approve user
    function approveUser(userId, data) {
      db.ref("approvals").child(userId).update({
        approved: true
      }).then(() => {
        alert("User approved!");
        loadUsers(); // Reload the users list
      });
    }

    // Reject user
    function rejectUser(userId) {
      db.ref("approvals").child(userId).remove().then(() => {
        alert("User rejected!");
        loadUsers(); // Reload the users list
      });
    }

    // Logout
    function logout() {
      window.location.href = "login.html"; // Redirect to login page
    }

    loadUsers(); // Load the users when the page is loaded
  </script>
</body>
</html>
