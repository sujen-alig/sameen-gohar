<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urge Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.8rem;
      color: #00e676;
      text-shadow: 2px 2px #000;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
    }

    button {
      background-color: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s, background-color 0.3s;
    }

    button:hover {
      background-color: #34495e;
      transform: translateY(-3px);
    }

    .stats {
      margin-top: 30px;
      font-size: 1.1rem;
      color: #fff;
      background-color: #1b2838;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .back-button {
      background-color: #007bff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1.2rem;
      color: white;
      cursor: pointer;
      margin-top: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .back-button:hover {
      background-color: #0056b3;
    }

    .urge-list {
      margin-top: 30px;
      width: 100%;
      max-width: 800px;
    }

    .urge-item {
      background-color: #2d3e50;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .urge-item span {
      display: block;
      margin: 5px 0;
    }

    .urge-item .reason {
      color: #f39c12;
    }
  </style>
</head>
<body>

  <h1>Urge Tracker</h1>

  <div class="buttons-container">
    <button onclick="markSuccess()">✅ Mark Success</button>
    <button onclick="markFailure()">❌ Mark Failure</button>
  </div>

  <div class="stats" id="stats">
    Loading stats...
  </div>

  <div class="urge-list" id="urge-list">
    <!-- List of urges will be displayed here -->
  </div>

  <button class="back-button" onclick="goBack()">🔙 Back to Dashboard</button>

  <script>
    // Function to load the stats from localStorage
    function loadStats() {
      const data = JSON.parse(localStorage.getItem("successFailureData")) || { success: 0, failure: 0 };
      document.getElementById("stats").innerText = `
        Success: ${data.success} | 
        Failure: ${data.failure}
      `;
    }

    // Function to mark Success
    function markSuccess() {
      const data = JSON.parse(localStorage.getItem("successFailureData")) || { success: 0, failure: 0 };
      const reason = prompt("Enter reason for Success (or leave blank):");

      const successData = {
        type: "Success",
        reason: reason || "No specific reason",
        time: new Date().toLocaleString()
      };

      const urges = JSON.parse(localStorage.getItem("urges")) || [];
      urges.push(successData);
      localStorage.setItem("urges", JSON.stringify(urges));

      data.success += 1;
      localStorage.setItem("successFailureData", JSON.stringify(data));
      loadStats(); // Reload stats
      loadUrges(); // Reload list of urges
    }

    // Function to mark Failure
    function markFailure() {
      const data = JSON.parse(localStorage.getItem("successFailureData")) || { success: 0, failure: 0 };
      const reason = prompt("Enter reason for Failure (or leave blank):");

      const failureData = {
        type: "Failure",
        reason: reason || "No specific reason",
        time: new Date().toLocaleString()
      };

      const urges = JSON.parse(localStorage.getItem("urges")) || [];
      urges.push(failureData);
      localStorage.setItem("urges", JSON.stringify(urges));

      data.failure += 1;
      localStorage.setItem("successFailureData", JSON.stringify(data));
      loadStats(); // Reload stats
      loadUrges(); // Reload list of urges
    }

    // Function to load the list of urges (success/failure with reasons)
    function loadUrges() {
      const urges = JSON.parse(localStorage.getItem("urges")) || [];
      const listElement = document.getElementById("urge-list");
      listElement.innerHTML = ""; // Clear previous list

      urges.forEach((urge) => {
        const urgeItem = document.createElement("div");
        urgeItem.classList.add("urge-item");
        urgeItem.innerHTML = `
          <span><strong>${urge.type}</strong> - ${urge.time}</span>
          <span class="reason">Reason: ${urge.reason}</span>
        `;
        listElement.appendChild(urgeItem);
      });
    }

    // Function to go back to the dashboard
    function goBack() {
      window.location.href = 'index.html'; // Replace with your actual dashboard page
    }

    // Load stats and urges when the page loads
    loadStats();
    loadUrges();
  </script>

</body>
</html>
