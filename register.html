<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #28a745; color: white; border: none; }
    button:hover { background: #218838; }
    .link { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="registerUser()">Register</button>
    <div class="link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    function registerUser() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!username || !password || !email) {
        alert("Please fill out all fields.");
        return;
      }

      const newUser = { username, password, email };
      let pending = JSON.parse(localStorage.getItem("pendingUsers")) || [];
      if (pending.find(u => u.username === username)) {
        alert("Username already pending approval.");
        return;
      }

      pending.push(newUser);
      localStorage.setItem("pendingUsers", JSON.stringify(pending));
      alert("Registration sent for admin approval.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>

<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #007bff; color: white; border: none; }
    button:hover { background: #0056b3; }
    .link { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="loginUser()">Login</button>
    <div class="link">
      New user? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    function loginUser() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value.trim();

      if (user === "sujen" && pass === "87654321") {
        alert("Welcome Admin");
        window.location.href = "admin.html";
        return;
      }

      const approved = JSON.parse(localStorage.getItem("approvedUsers")) || [];
      const match = approved.find(u => u.username === user && u.password === pass);

      if (match) {
        alert("Login successful");
        window.location.href = "home.html";
      } else {
        alert("Not approved or invalid credentials");
      }
    }
  </script>
</body>
</html>

<!-- admin.html (main part only) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
</head>
<body>
  <h2>Pending Registrations</h2>
  <div id="pending-list"></div>

  <script>
    function loadPendingUsers() {
      const pending = JSON.parse(localStorage.getItem("pendingUsers")) || [];
      const container = document.getElementById("pending-list");
      container.innerHTML = "";

      pending.forEach((user, index) => {
        const div = document.createElement("div");
        div.innerHTML = `
          <p><strong>${user.username}</strong> (${user.email})</p>
          <button onclick="approveUser(${index})">Approve</button>
          <button onclick="removeUser(${index})">Reject</button>
        `;
        container.appendChild(div);
      });
    }

    function approveUser(index) {
      let pending = JSON.parse(localStorage.getItem("pendingUsers")) || [];
      const user = pending.splice(index, 1)[0];
      let approved = JSON.parse(localStorage.getItem("approvedUsers")) || [];
      approved.push(user);
      localStorage.setItem("approvedUsers", JSON.stringify(approved));
      localStorage.setItem("pendingUsers", JSON.stringify(pending));
      loadPendingUsers();
    }

    function removeUser(index) {
      let pending = JSON.parse(localStorage.getItem("pendingUsers")) || [];
      pending.splice(index, 1);
      localStorage.setItem("pendingUsers", JSON.stringify(pending));
      loadPendingUsers();
    }

    loadPendingUsers();
  </script>
</body>
</html>
