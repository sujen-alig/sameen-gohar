<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #28a745; color: white; border: none; }
    button:hover { background: #218838; }
    .link { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="registerUser()">Register</button>
    <div class="link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    function registerUser() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!username || !password || !email) {
        alert("Please fill out all fields.");
        return;
      }

      const newUser = { username, password, email };
      let pending = JSON.parse(localStorage.getItem("pendingUsers")) || [];
      if (pending.find(u => u.username === username)) {
        alert("Username already pending approval.");
        return;
      }

      pending.push(newUser);
      localStorage.setItem("pendingUsers", JSON.stringify(pending));
      alert("Registration sent for admin approval.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
