<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #232526, #414345);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #2c3e50;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #00e676;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
    }

    input {
      background: #ecf0f1;
    }

    button {
      background-color: #00e676;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #00c853;
    }

    .message {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #ff5252;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>User Registration</h2>
    <input type="text" id="username" placeholder="Enter your name" required />
    <input type="email" id="email" placeholder="Enter your email" required />
    <input type="password" id="password" placeholder="Enter your password" required />
    <button onclick="registerUser()">Register</button>
    <p class="message" id="msg"></p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyClczr-VHpPkFgrPfOQJI5aL6-zL0lWOv8",
      authDomain: "sujen-2130a.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "
sujen-2130a ",
      storageBucket: "sujen-2130a.firebasestorage.app",
      messagingSenderId: "818571217823",
      appId: "
1:818571217823:web:1231f1cfb38810c7d1cbaa"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function registerUser() {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      if (!username || !email || !password) {
        msg.textContent = "Please fill in all fields.";
        return;
      }

      const request = {
        username,
        email,
        password,
        approved: false,
        timestamp: Date.now()
      };

      const newRef = db.ref("approvals").push();
      newRef.set(request, (error) => {
        if (error) {
          msg.textContent = "Registration failed.";
        } else {
          msg.style.color = "#00e676";
          msg.textContent = "Request sent. Wait for admin approval.";
        }
      });
    }
  </script>
</body>
</html>
