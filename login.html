<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    button { background: #007bff; color: white; border: none; }
    button:hover { background: #0056b3; }
    .link { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="loginUser()">Login</button>
    <div class="link">
      New user? <a href="register.html">Register here</a>
    </div>
  </div>

  <script>
    function loginUser() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value.trim();

      if (user === "sujen" && pass === "87654321") {
        alert("Welcome Admin");
        window.location.href = "admin.html";
        return;
      }

      const approved = JSON.parse(localStorage.getItem("approvedUsers")) || [];
      const match = approved.find(u => u.username === user && u.password === pass);

      if (match) {
        alert("Login successful");
        window.location.href = "home.html";
      } else {
        alert("Not approved or invalid credentials");
      }
    }
  </script>
</body>
</html>
