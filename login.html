<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MR Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #1f4037, #99f2c8);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #2d3436;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #00b894;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #019875;
    }
    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyClczr-VHpPkFgrPfOQJI5aL6-zL0lWOv8",
      authDomain: "sujen-2130a.firebaseapp.com",
      projectId: "sujen-2130a",
      storageBucket: "sujen-2130a.appspot.com",
      messagingSenderId: "818571217823",
      appId: "1:818571217823:web:1231f1cfb38810c7d1cbaa",
      databaseURL: "https://sujen-2130a-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (email === "sujen" && password === "87654321") {
        window.location.href = "admin.html";
        return;
      }

      db.ref("approvals").once("value", (snapshot) => {
        let found = false;
        snapshot.forEach((child) => {
          const data = child.val();
          if (data.email === email && data.password === password) {
            found = true;
            if (data.approved) {
              window.location.href = "home.html";
            } else {
              errorMsg.textContent = "Your account is not approved yet.";
            }
          }
        });
        if (!found) {
          errorMsg.textContent = "Invalid credentials.";
        }
      });
    }
  </script>
</body>
</html>
